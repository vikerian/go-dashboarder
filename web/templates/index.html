{{define "content"}}
<h1>Dashboard senzorů</h1>
<div class="card">
    <div id="status">Načítám...</div>
    <div style="height: 500px; margin-top: 20px">
        <canvas id="mainChart"></canvas>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const ctx = document.getElementById("mainChart").getContext("2d");
        const myChart = new Chart(ctx, {
            type: "line",
            data: { datasets: [] },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                parsing: false, // Ruční zpracování pro stabilitu
                scales: {
                    x: {
                        type: "category",
                        grid: { color: "#333" },
                        ticks: { color: "#888" },
                    },
                    y: { grid: { color: "#333" }, ticks: { color: "#ccc" } },
                },
            },
        });

        async function updateDashboard() {
            try {
                const response = await fetch("/api/v1/latest?limit=300");
                const rawData = await response.json();
                if (!rawData) return;

                // 1. TOTÁLNÍ SEŘAZENÍ (aby čára necouvala)
                rawData.sort(
                    (a, b) => new Date(a.timestamp) - new Date(b.timestamp),
                );

                // 2. SESKUPOVÁNÍ PODLE UNIKÁTNÍHO KLÍČE (ID + Metrika)
                // Společný, chronologicky seřazený seznam štítků pro osu X.
                // Bez tohohle si Chart.js kategorie skládá v pořadí, v jakém
                // narazí na jednotlivé datasety (ne podle času), takže osa
                // pak skáče v čase tam a zpátky a řídké datasety (např.
                // počasí) skončí namačkané mimo své skutečné místo.
                const labels = [];
                const seenLabels = new Set();
                const groups = {};
                rawData.forEach((item) => {
                    // Použijeme Metric (key) k odlišení DS1 a DS2
                    const label = `${item.device_id} (${item.metric})`;

                    if (!groups[label]) {
                        const isWeather = label
                            .toLowerCase()
                            .includes("weather");
                        groups[label] = {
                            label: label,
                            data: [],
                            borderColor: label.includes("ds1")
                                ? "#00e676"
                                : label.includes("ds2")
                                  ? "#2979ff"
                                  : "#ff9800",
                            borderDash: isWeather ? [5, 5] : [],
                            tension: 0.1,
                            pointRadius: 2,
                        };
                    }

                    // Přidáme bod, pokud pro tento čas už neexistuje (deduplikace vteřiny)
                    const timeStr = item.timestamp.substring(11, 19);
                    if (!seenLabels.has(timeStr)) {
                        seenLabels.add(timeStr);
                        labels.push(timeStr);
                    }
                    if (!groups[label].data.find((p) => p.x === timeStr)) {
                        groups[label].data.push({ x: timeStr, y: item.value });
                    }
                });

                myChart.data.labels = labels;
                myChart.data.datasets = Object.values(groups);
                myChart.update("none");
                document.getElementById("status").innerText =
                    "Update: " + new Date().toLocaleTimeString();
            } catch (e) {
                console.error(e);
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 5000);
    });
</script>
{{end}}
