{{define "layout"}}
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>RPi Local Dashboard</title>
    <script src="/static/chart.min.js"></script>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; --accent: #00e676; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; }
        nav { width: 220px; background: #000; padding: 20px; border-right: 1px solid #333; }
        nav a { display: block; padding: 10px; color: #888; text-decoration: none; border-radius: 4px; }
        nav a.active { background: var(--accent); color: #000; font-weight: bold; }
        main { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid #333; }
    </style>
</head>
<body>
    <nav>
        <h2 style="color: var(--accent)">Dashboarder</h2>
        <a href="/" class="{{if eq .CurrentPage "index"}}active{{end}}">🏠 Přehled</a>
        <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">
        {{range .Pages}}
            <a href="{{.Link}}" class="{{if eq $.CurrentPage .Name}}active{{end}}">📄 {{.Name}}</a>
        {{end}}
    </nav>
    <main>
        {{template "content" .}}
    </main>
</body>
</html>
{{end}}
